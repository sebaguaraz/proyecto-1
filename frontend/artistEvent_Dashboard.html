<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Eventos - Conexión Musical</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/artistEvent_Dashboard.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="content-logo">
                <img src="img/logo-musica.jpg" class="logo" alt="Logo Conexión Musical">
            </div>
            <h1 class="title">Panel de Artista</h1>
            <ul class="nav-links">
                <li>
                    <button class="logout-button" id="logout-button" type="button">
                        <a href="#" id="logoutButton">Cerrar Sesión</a>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <div class="container-wrapper">

        <aside class="sidebar">
            <div class="sidebar_profile-header">
                <i class="bi bi-person-circle profile-icon"></i>
                <span id="artistName">Perfil de Artista</span>
            </div>
            <nav class="sidebar-nav">
                <ul class="sidebar-links">
                    <li class="nav-item">
                        <a href="artistEvent_Dashboard.html">
                            <i class="bi bi-calendar-event icon"></i>
                            Mis Eventos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="EventCRUD_Dashboard.html">
                            <i class="bi bi-pencil-square icon"></i>
                            Editar Evento
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="artistProfile_Dashboard.html">
                            <i class="bi bi-person-badge icon"></i>
                            Editar Perfil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="EventCreate_Dashboard.html">
                            <i class="bi bi-plus-circle icon"></i>
                            Crear Evento
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="content-main">

            <h2 class="page-title">Mis Eventos</h2>
            <span class="page-subtitle">Visualiza tus próximos conciertos.</span>

            <section class="events-list-panel">
                <header class="panel-header">
                    <h3>Eventos Registrados</h3>
                    <a href="EventCreate_Dashboard.html" class="btn-primary-small">
                        <i class="bi bi-plus-lg icon"></i> Crear Evento
                    </a>
                </header>


                <div class="data-table" id="eventTableBody">

                </div>

            </section>

        </main>
    </div>

    <footer>
        <p>© 2025 Conexión Musical. Todos los derechos reservados.</p>
    </footer>

    <script src="js/ArtistEvent_Dashboard.js"></script>
</body>

</html>
